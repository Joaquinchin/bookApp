name: PR – Build Check

# DESCRIPCIÓN DEL WORKFLOW:
# Este workflow verifica que la aplicación se pueda compilar exitosamente
# antes de permitir el merge de un Pull Request.
#
# QUÉ HACE:
# 1. Ejecuta build en múltiples versiones de Node.js (18 y 20)
# 2. Instala dependencias con cache optimizado
# 3. Compila la aplicación Next.js para producción
# 4. Comenta resultados automáticamente en el PR
# 5. Bloquea el merge si el build falla

on:
  pull_request:
    branches: [main, master]  # Se ejecuta cuando se abre/actualiza PR hacia main

permissions:
  contents: read              # Permiso para leer el código del repositorio
  pull-requests: write        # Permiso para comentar en Pull Requests

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continúa con otras versiones aunque una falle
      matrix:
        node: [18, 20]  # Prueba en Node.js 18 LTS y 20 LTS para compatibilidad

    steps:
      # PASO 1: Descargar código fuente del Pull Request
      - name: Checkout
        uses: actions/checkout@v4

      # PASO 2: Configurar versión específica de Node.js con cache de npm
      # El cache accelera builds subsecuentes al reutilizar dependencias
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm  # Cache automático de node_modules basado en package-lock.json

      # PASO 3: Instalar dependencias exactas basadas en package-lock.json
      # npm ci es más rápido y confiable que npm install para CI/CD
      - name: Install
        run: npm ci

      # PASO 4: Cache específico de Next.js build 
      # Reutiliza archivos compilados entre builds para mayor velocidad
      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ matrix.node }}-
            next-

      # PASO 5: Compilar aplicación para producción
      # Este es el paso crítico - si falla, el PR no puede mergearse
      - name: Build
        env:
          NODE_ENV: production                    # Compilación optimizada
          NODE_OPTIONS: --max_old_space_size=4096 # Más memoria para builds grandes
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}
        run: npm run build

      # PASO 6: Comentar éxito en PR (solo para Node 20 para evitar duplicados)
      - name: Comment PR Build Success
        if: success() && matrix.node == 20
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Build exitoso!**\n\n' +
                    '- Compilación exitosa en Node.js 18 y 20\n' +
                    '- todas las dependencias instaladas correctamente\n' +
                    '- Aplicación lista para producción\n' +
                    '- Cache optimizado para builds futuros\n\n' +
                    '**Tu código está listo para merge!** 🎉'
            })
            
      # PASO 7: Comentar error en PR (solo para Node 20 para evitar duplicados)
      - name: Comment PR Build Failure
        if: failure() && matrix.node == 20
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Build falló!**\n\n' +
                    '**Posibles causas:**\n' +
                    '- Error de sintaxis en TypeScript/JavaScript\n' +
                    '- Dependencia faltante o incompatible en package.json\n' +
                    '- Error en configuración de Next.js\n' +
                    '- Problema con variables de entorno\n' +
                    '- Error de tipos en TypeScript\n\n' +
                    '**[Ver detalles del error](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**\n\n' 
            })
